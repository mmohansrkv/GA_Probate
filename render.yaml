services:
  - type: web
    name: lnga-probate-courts-tool
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # Chrome needs more than the free plan's 512MB RAM
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: CHROME_BIN
        value: /usr/bin/google-chrome-stable
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: lnga-probate-data
      mountPath: /var/data
      sizeGB: 5
